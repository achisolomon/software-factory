<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Software Factory: an open-source AI engineering team that takes your idea to release, and stops for your approval at every important decision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#93C5FD"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #172554; stroke: #3B82F6; stroke-width: 2; }
    .stage { fill: #fff; font-size: 22px; font-weight: 700; text-anchor: middle; }
    .who { fill: #93C5FD; font-size: 14px; text-anchor: middle; }
    .flow { stroke: #93C5FD; stroke-width: 3; marker-end: url(#arrow); }
    .gate { fill: #FBBF24; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- logo (assets/logo.svg scaled to 96px) -->
  <g transform="translate(80 72) scale(0.1875)">
    <rect width="512" height="512" rx="112" fill="#1D4ED8"/>
    <path fill="#fff" d="M120 364V216h52v-48h56v48h56v-48h56v48h52v148h-36v-92H156v92zm68-52h52v52h-52zm84 0h52v52h-52z"/>
    <path fill="#93C5FD" d="M180 124h152v36H180z"/>
  </g>
  <text x="200" y="128" fill="#fff" font-size="60" font-weight="800">Software Factory</text>
  <text x="200" y="170" fill="#BFDBFE" font-size="26">An open-source AI engineering team that takes your idea to release.</text>

  <!-- pipeline -->
  <g>
    <rect class="box" x="80" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="160" y="336">Idea</text><text class="who" x="160" y="362">you</text>

    <rect class="box" x="272" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="352" y="336">Discovery</text><text class="who" x="352" y="362">Product Manager</text>

    <rect class="box" x="464" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="544" y="336">Architecture</text><text class="who" x="544" y="362">Architect</text>

    <rect class="box" x="656" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="736" y="336">Build + tests</text><text class="who" x="736" y="362">Developer · Test</text>

    <rect class="box" x="848" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="928" y="336">Reviews</text><text class="who" x="928" y="362">Security · FinOps · UX</text>

    <rect class="box" x="1040" y="300" width="160" height="80" rx="14"/>
    <text class="stage" x="1120" y="336">Release</text><text class="who" x="1120" y="362">DevOps · Performance</text>

    <line class="flow" x1="242" y1="340" x2="268" y2="340"/>
    <line class="flow" x1="434" y1="340" x2="460" y2="340"/>
    <line class="flow" x1="626" y1="340" x2="652" y2="340"/>
    <line class="flow" x1="818" y1="340" x2="844" y2="340"/>
    <line class="flow" x1="1010" y1="340" x2="1036" y2="340"/>
  </g>

  <!-- approval gates -->
  <g>
    <path d="M448 284V330M640 284V330M1024 284V330" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4"/>
    <circle class="gate" cx="448" cy="270" r="13"/>
    <circle class="gate" cx="640" cy="270" r="13"/>
    <circle class="gate" cx="1024" cy="270" r="13"/>
    <path d="M441 270l5 5l9-10M633 270l5 5l9-10M1017 270l5 5l9-10" fill="none" stroke="#0B1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="gate" cx="90" cy="430" r="9"/>
    <text x="108" y="436" fill="#FDE68A" font-size="18">You approve every important decision: the PRD, the design and its cost, the release. Nothing ships without you.</text>
  </g>

  <!-- community -->
  <line x1="80" y1="490" x2="1200" y2="490" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="80" y="540" fill="#fff" font-size="28" font-weight="700">Anyone can build a software factory alone. Let's build the best one together.</text>
  <text x="80" y="580" fill="#93C5FD" font-size="20">11 agents  ·  Claude Code and Codex plugin  ·  Contributions welcome</text>
</svg>
